[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "urmc_nn_asgn"
version = "0.1.0"
description = "Shared utility library for URMC Neural Networks Assignment"
readme = "Readme.md"
requires-python = ">=3.13"
dependencies = [
    "pandas>=2.2.0",
    "numpy>=2.1.0",
    "torch>=2.4.0",
    "scikit-learn>=1.5.0",
    "matplotlib>=3.9.0",
    "seaborn>=0.13.0",
    "python-dotenv>=1.0.0",
    "jupyterlab>=4.2.0",
    "ipykernel",
    "jupyterlab",
    "fastparquet"
]

[tool.setuptools.packages.find]
where = ["."]